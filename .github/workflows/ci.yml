name: CI and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Check and package Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Rust checks
        run: make check
      - name: Build installable plugin
        run: make package
      - name: Test the release binary through the OpenDeck protocol
        env:
          CODEX_USAGE_TEST_BINARY: target/release/opendeck-codex-usage
        run: python scripts/smoke.py
      - name: Verify package and release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/check_package.py --tag "$RELEASE_TAG"
      - name: Generate checksum
        working-directory: dist
        run: sha256sum codex-usage-linux-x86_64.zip > codex-usage-linux-x86_64.zip.sha256
      - name: Upload installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-usage-linux-x86_64
          path: |
            dist/codex-usage-linux-x86_64.zip
            dist/codex-usage-linux-x86_64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-usage-linux-x86_64
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check codex-usage-linux-x86_64.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/codex-usage-linux-x86_64.zip \
            dist/codex-usage-linux-x86_64.zip.sha256 \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${args[@]}"

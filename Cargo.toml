[package]
name = "opendeck-codex-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
openaction = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
base64 = "0.23"
log = "0.4"
simplelog = "0.12"
